<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crush Course — 4-Player Trap Race</title>
<style>
  html,body{margin:0;height:100%;background:#07080f;overflow:hidden;font-family:Verdana,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;box-shadow:0 0 60px rgba(0,0,0,.8)}
  canvas{display:block;width:100%;height:100%;outline:none}
  #fs{position:absolute;top:10px;right:10px;width:38px;height:38px;border-radius:8px;border:2px solid rgba(255,255,255,.35);
      background:rgba(10,12,24,.55);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;opacity:.7;transition:opacity .2s}
  #fs:hover{opacity:1}
  #fs svg{width:20px;height:20px}
  #nameBox{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;background:rgba(5,6,14,.75);z-index:3;color:#fff;font:700 18px Verdana,sans-serif}
  #nameBox input{font:700 26px Verdana,sans-serif;width:12em;max-width:80%;text-align:center;padding:8px;border-radius:10px;border:3px solid #ffe36b;background:#111428;color:#fff;outline:none}
  #nameBox button{font:700 16px Verdana,sans-serif;padding:8px 22px;margin:0 6px;border-radius:9px;border:0;cursor:pointer}
  #nbOk{background:#ffe36b} #nbX{background:#555;color:#fff}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <canvas id="c" tabindex="0"></canvas>
  <button id="fs" title="Fullscreen (F)" aria-label="Toggle fullscreen">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
  </button>
  <div id="nameBox"><div>Name for <span id="nbP"></span></div><input id="nbIn" maxlength="12" placeholder="Type a name" autocomplete="off">
    <div><button id="nbOk">Save</button><button id="nbX">Cancel</button></div><div style="font-size:12px;opacity:.7">Saved in this browser · leave empty to use the colour name</div></div>
</div></div>
<!-- Optional online libraries for phone controllers. The game still runs fully offline without them. -->
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
'use strict';
// =====================================================================
//  CRUSH COURSE — a 4-player local trap-race platformer
//  Single file, no assets. Canvas graphics + Web Audio sound.
// =====================================================================

const W = 1280, H = 720, TS = 40, ROWS = 18;
const STEP = 1 / 120;           // fixed simulation step
const TAU = Math.PI * 2;
const WIN_SCORE = 5;

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const approach = (v, t, d) => v < t ? Math.min(v + d, t) : Math.max(v - d, t);
function hash(a, b) {
  let h = (Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263)) | 0;
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
const rnd = (a, b) => a + Math.random() * (b - a);

// ---------------------------------------------------------------------
//  Canvas & scaling (16:9 letterbox, crisp on HiDPI)
// ---------------------------------------------------------------------
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
let viewScale = 1;
function resize() {
  const ww = window.innerWidth, wh = window.innerHeight;
  let w = ww, h = ww * 9 / 16;
  if (h > wh) { h = wh; w = wh * 16 / 9; }
  w = Math.floor(w); h = Math.floor(h);
  stage.style.width = w + 'px'; stage.style.height = h + 'px';
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
  viewScale = canvas.width / W;
}
window.addEventListener('resize', resize);
resize();

function toggleFullscreen() {
  if (!document.fullscreenElement) {
    (document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen).call(document.documentElement).catch?.(() => {});
  } else {
    (document.exitFullscreen || document.webkitExitFullscreen).call(document);
  }
}
document.getElementById('fs').addEventListener('click', e => { audioInit(); toggleFullscreen(); e.currentTarget.blur(); canvas.focus(); });
canvas.addEventListener('pointerdown', () => { audioInit(); canvas.focus(); });

// ---------------------------------------------------------------------
//  Audio (Web Audio API, all synthesized)
// ---------------------------------------------------------------------
const AU = { ctx: null, master: null, sfx: null, mus: null, noise: null, mode: 0 }; // mode 0 all on, 1 music off, 2 muted
function audioInit() {
  if (AU.ctx) { if (AU.ctx.state === 'suspended') AU.ctx.resume(); return; }
  try {
    const C = new (window.AudioContext || window.webkitAudioContext)();
    AU.ctx = C;
    AU.master = C.createGain(); AU.master.gain.value = 0.7; AU.master.connect(C.destination);
    AU.sfx = C.createGain(); AU.sfx.gain.value = 1; AU.sfx.connect(AU.master);
    AU.mus = C.createGain(); AU.mus.gain.value = 0.32; AU.mus.connect(AU.master);
    const len = C.sampleRate;
    const buf = C.createBuffer(1, len, C.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    AU.noise = buf;
    Music.next = C.currentTime + 0.1;
    applyAudioMode();
  } catch (e) { AU.ctx = null; }
}
function applyAudioMode() {
  if (!AU.ctx) return;
  AU.master.gain.value = AU.mode === 2 ? 0 : 0.7;
  AU.mus.gain.value = AU.mode === 0 ? 0.32 : 0;
}
function tone(f, dur, type = 'square', vol = 0.2, f2 = 0, at = 0, dest = null) {
  const C = AU.ctx; if (!C) return;
  const t = at || C.currentTime;
  const o = C.createOscillator(), g = C.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t + 0.006);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); g.connect(dest || AU.sfx);
  o.start(t); o.stop(t + dur + 0.03);
}
function noise(dur, vol, freq, ftype = 'lowpass', f2 = 0, at = 0, dest = null, q = 1) {
  const C = AU.ctx; if (!C || !AU.noise) return;
  const t = at || C.currentTime;
  const s = C.createBufferSource(); s.buffer = AU.noise;
  const f = C.createBiquadFilter(); f.type = ftype; f.frequency.setValueAtTime(freq, t); f.Q.value = q;
  if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = C.createGain();
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(g); g.connect(dest || AU.sfx);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.03);
}
const midi = n => 440 * Math.pow(2, (n - 69) / 12);
let lastLandSfx = 0;
const SFX = {
  jump() { tone(330, 0.13, 'square', 0.09, 700); },
  land() { const n = performance.now(); if (n - lastLandSfx < 40) return; lastLandSfx = n; noise(0.07, 0.18, 900, 'lowpass', 200); },
  bump() { tone(180, 0.09, 'square', 0.14, 90); noise(0.05, 0.15, 1500, 'bandpass'); },
  spring() { tone(180, 0.32, 'triangle', 0.3, 980); tone(360, 0.2, 'sine', 0.12, 1400); },
  crumble() { noise(0.25, 0.22, 1400, 'bandpass', 300, 0, null, 2); },
  slam(vol = 1) { noise(0.35, 0.55 * vol, 600, 'lowpass', 50); tone(80, 0.3, 'sine', 0.45 * vol, 35); },
  death() { noise(0.4, 0.4, 3000, 'lowpass', 150); tone(520, 0.45, 'sawtooth', 0.12, 50); },
  blocked() { tone(300, 0.15, 'square', 0.14, 200); tone(200, 0.35, 'square', 0.14, 70, AU.ctx ? AU.ctx.currentTime + 0.12 : 0); },
  beep() { tone(660, 0.14, 'square', 0.13); },
  go() { tone(990, 0.4, 'square', 0.15); tone(1320, 0.4, 'square', 0.07); },
  join(i) { const b = [523, 659, 784, 880][i]; tone(b, 0.12, 'square', 0.12); tone(b * 1.5, 0.18, 'square', 0.1, 0, AU.ctx ? AU.ctx.currentTime + 0.08 : 0); },
  leave() { tone(400, 0.15, 'square', 0.1, 200); },
  select() { tone(880, 0.06, 'square', 0.08); },
  win() {
    if (!AU.ctx) return; const t = AU.ctx.currentTime;
    [0, 4, 7, 12, 7, 12, 16].forEach((n, i) => tone(midi(72 + n), 0.22, 'square', 0.12, 0, t + i * 0.09));
  },
  draw() { if (!AU.ctx) return; const t = AU.ctx.currentTime; [0, -3, -6].forEach((n, i) => tone(midi(64 + n), 0.3, 'triangle', 0.2, 0, t + i * 0.18)); },
  fanfare() {
    if (!AU.ctx) return; const t = AU.ctx.currentTime;
    const seq = [[60, 0], [64, .15], [67, .3], [72, .45], [67, .75], [72, .9], [76, 1.05], [79, 1.3]];
    seq.forEach(([n, d]) => { tone(midi(n + 12), 0.35, 'square', 0.12, 0, t + d); tone(midi(n), 0.35, 'triangle', 0.18, 0, t + d); });
  },
};

// tiny chiptune loop, scheduled with look-ahead
const Music = { next: 0, step: 0 };
function musicTick() {
  const C = AU.ctx; if (!C || C.state !== 'running') return;
  const racing = G.state === 'play' || G.state === 'countdown' || G.state === 'roundEnd';
  const tempo = racing ? 138 : 104;
  const sd = 60 / tempo / 4;
  if (Music.next < C.currentTime - 0.2) Music.next = C.currentTime + 0.05;
  while (Music.next < C.currentTime + 0.15) {
    const t = Music.next, st = Music.step, s = st % 16, bar = Math.floor(st / 16) % 4;
    const root = [45, 41, 48, 43][bar];
    const chord = bar === 0 ? [0, 3, 7, 12] : [0, 4, 7, 12];
    if (s % 2 === 0) tone(midi(root + (s % 4 === 2 ? 12 : 0)), sd * 1.8, 'triangle', 0.3, 0, t, AU.mus);
    if (s % 2 === 1) noise(0.035, racing ? 0.09 : 0.05, 7000, 'highpass', 0, t, AU.mus);
    if (racing) {
      if (s % 4 === 0) tone(130, 0.16, 'sine', 0.45, 40, t, AU.mus);
      if (s === 4 || s === 12) noise(0.13, 0.17, 1700, 'bandpass', 0, t, AU.mus);
      if (s % 2 === 0) tone(midi(root + 24 + chord[(s / 2) % 4]), sd * 1.4, 'square', 0.035, 0, t, AU.mus);
    } else if (s % 4 === 0) {
      tone(midi(root + 24 + chord[(s / 4) % 4]), sd * 3, 'sine', 0.06, 0, t, AU.mus);
    }
    Music.next += sd; Music.step++;
  }
}

// ---------------------------------------------------------------------
//  Input: 4 keyboard sets + 4 gamepads
// ---------------------------------------------------------------------
const KB = [
  { l: 'KeyA', r: 'KeyD', j: 'KeyW', label: 'Keyboard', keys: 'A · D · W', joinKey: 'W' },
  { l: 'ArrowLeft', r: 'ArrowRight', j: 'ArrowUp', label: 'Keyboard', keys: '← · → · ↑', joinKey: '↑' },
  { l: 'KeyJ', r: 'KeyL', j: 'KeyI', label: 'Keyboard', keys: 'J · L · I', joinKey: 'I' },
  { l: 'Numpad4', r: 'Numpad6', j: 'Numpad8', label: 'Numpad', keys: '4 · 6 · 8', joinKey: 'Num 8' },
];
const keys = new Set(), tapped = new Set(), menuPress = new Set();
const BLOCK_DEFAULT = new Set(['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space', 'Tab', 'Backspace',
  'Numpad4', 'Numpad6', 'Numpad8', 'Numpad2', 'Numpad5']);
window.addEventListener('keydown', e => {
  if (document.activeElement === nbIn) return;
  audioInit();
  if (BLOCK_DEFAULT.has(e.code)) e.preventDefault();
  if (!e.repeat) { tapped.add(e.code); menuPress.add(e.code); }
  keys.add(e.code);
});
window.addEventListener('keyup', e => keys.delete(e.code));
window.addEventListener('blur', () => { keys.clear(); if (G.state === 'play' || G.state === 'countdown') G.paused = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden && (G.state === 'play' || G.state === 'countdown')) G.paused = true; });

const SRC = [];
for (let i = 0; i < 4; i++) SRC.push({ type: 'kb', i, connected: true, l: false, r: false, j: false, pj: false, jp: false, ej: false, est: false, ebk: false, esel: false });
for (let i = 0; i < 4; i++) SRC.push({ type: 'gp', i, connected: false, l: false, r: false, j: false, pj: false, jp: false, ej: false, est: false, pst: false, ebk: false, pbk: false, esel: false, psel: false });
function srcLabel(si) {
  const s = SRC[si];
  if (s.type === 'kb') return { a: KB[s.i].label, b: KB[s.i].keys };
  if (s.type === 'ph') return { a: '📱 Phone', b: 'Touch controls' };
  return { a: 'Gamepad ' + (s.i + 1), b: 'Stick/D-pad · A' };
}
function pollInput() {
  for (let i = 0; i < 4; i++) {
    const s = SRC[i], k = KB[i];
    s.l = keys.has(k.l); s.r = keys.has(k.r);
    const j = keys.has(k.j);
    s.ej = (j && !s.pj) || tapped.has(k.j);
    s.j = j; s.pj = j;
    if (s.ej) s.jp = true;
  }
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (let i = 0; i < 4; i++) {
    const s = SRC[4 + i], gp = pads && pads[i];
    if (!gp || !gp.connected) {
      s.connected = false; s.l = s.r = s.j = s.pj = false; s.ej = s.est = s.ebk = s.esel = false; continue;
    }
    s.connected = true;
    const b = n => !!(gp.buttons[n] && gp.buttons[n].pressed);
    const ax = gp.axes[0] || 0;
    s.l = ax < -0.4 || b(14); s.r = ax > 0.4 || b(15);
    const j = b(0);
    s.ej = j && !s.pj; s.j = j; s.pj = j; if (s.ej) s.jp = true;
    const st = b(9); s.est = st && !s.pst; s.pst = st;
    const bk = b(1); s.ebk = bk && !s.pbk; s.pbk = bk;
    const sel = b(8) || b(4) || b(5); s.esel = sel && !s.psel; s.psel = sel;
  }
  for (let i = 8; i < SRC.length; i++) {
    const s = SRC[i];
    if (!s.connected) { s.l = s.r = s.j = s.pj = false; s.ej = s.est = s.ebk = s.esel = false; s.tap = s.stTap = false; continue; }
    s.l = s.rl; s.r = s.rr;
    s.ej = s.tap || (s.rj && !s.pj); s.tap = false;
    s.j = s.rj; s.pj = s.rj; if (s.ej) s.jp = true;
    s.est = s.stTap; s.stTap = false; s.ebk = false; s.esel = false;
  }
  tapped.clear();
}

// ---------------------------------------------------------------------
//  Phone controllers: the PC hosts a PeerJS (WebRTC) room, phones join it
//  by scanning the QR code, which opens controller.html on the same site.
// ---------------------------------------------------------------------
const NET = { status: 'off', code: '', url: '', qr: null, phones: [], count: 0 };
const ICE = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }] };
function peerOptions() {
  const q = new URLSearchParams(location.search), o = { config: ICE };
  if (q.get('peerhost')) { o.host = q.get('peerhost'); o.port = +q.get('peerport') || 9000; o.path = q.get('peerpath') || '/'; o.secure = q.get('peersecure') === '1'; }
  return o;
}
function netInit() {
  if (!/^https?:$/.test(location.protocol)) { NET.status = 'local'; return; }
  if (!window.Peer) { NET.status = 'nolib'; return; }
  startPeer();
}
function startPeer() {
  const AL = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  NET.code = Array.from({ length: 5 }, () => AL[Math.floor(Math.random() * AL.length)]).join('');
  NET.status = 'connecting';
  const peer = new Peer('crushcourse-' + NET.code.toLowerCase(), peerOptions());
  NET.peer = peer;
  peer.on('open', () => {
    NET.status = 'ready';
    const u = new URL('controller.html', location.href);
    u.search = location.search; u.hash = NET.code;
    NET.url = u.href;
    NET.qr = makeQR(NET.url);
  });
  peer.on('connection', setupPhone);
  peer.on('disconnected', () => { if (NET.status === 'ready') NET.status = 'reconnecting'; setTimeout(() => { if (!peer.destroyed && peer.disconnected) peer.reconnect(); }, 2000); });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { peer.destroy(); startPeer(); return; }
    if (err.type === 'browser-incompatible') { NET.status = 'nolib'; return; }
    if (['network', 'server-error', 'socket-error', 'socket-closed'].includes(err.type)) {
      NET.status = 'reconnecting';
      setTimeout(() => { if (!peer.destroyed && peer.disconnected) peer.reconnect(); }, 3000);
    }
  });
}
function makeQR(text) {
  if (!window.qrcode) return null;
  try {
    const q = qrcode(0, 'M'); q.addData(text); q.make();
    const n = q.getModuleCount(), m = [];
    for (let r = 0; r < n; r++) { const row = []; for (let c = 0; c < n; c++) row.push(q.isDark(r, c)); m.push(row); }
    return m;
  } catch (e) { return null; }
}
function cleanName(n) { return String(n || '').replace(/[\u0000-\u001f\u007f<>]/g, '').replace(/\s+/g, ' ').trim().slice(0, 12); }
const ownSlot = si => G.slots.findIndex(s => s && s.src === si);
function setupPhone(conn) {
  const src = { type: 'ph', phone: ++NET.count, connected: false, rl: false, rr: false, rj: false, tap: false, stTap: false,
    l: false, r: false, j: false, pj: false, jp: false, ej: false, est: false, ebk: false, esel: false, pid: '', name: '' };
  SRC.push(src);
  const si = SRC.length - 1;
  const ph = { conn, src, si, no: src.phone, last: performance.now(), open: false, sent: '' };
  NET.phones.push(ph);
  const drop = () => {
    if (!ph.open) return;
    ph.open = false; src.connected = false; src.rl = src.rr = src.rj = false;
    NET.phones = NET.phones.filter(x => x !== ph);
    G.toast = { text: `📱 ${src.name || 'Phone ' + ph.no} disconnected`, t: 2 };
  };
  conn.on('open', () => { ph.open = true; src.connected = true; ph.last = performance.now(); SFX.select(); }); // lobby info is sent after the phone says hello
  conn.on('data', msg => {
    if (!msg || typeof msg !== 'object') return;
    ph.last = performance.now();
    if (msg.t === 'hello') {
      src.pid = String(msg.pid || '').slice(0, 40); src.name = cleanName(msg.name);
      // a phone that reloads or drops mid-match gets its player back
      const slot = src.pid ? G.slots.findIndex(x => x && x.pid === src.pid) : -1;
      if (slot >= 0) {
        G.slots[slot].src = si; if (src.name) G.slots[slot].name = src.name;
        for (const p of G.players) if (p.id === slot) p.src = si;
        G.toast = { text: `📱 ${displayName(slot)} reconnected`, t: 2 };
      } else G.toast = { text: `📱 ${src.name || 'Phone ' + ph.no} connected`, t: 2 };
      sendLobby(ph, true);
    } else if (msg.t === 'pick') pickSlot(ph, msg.slot | 0, cleanName(msg.name));
    else if (msg.t === 'leave') {
      const slot = ownSlot(si);
      if (slot >= 0 && G.state === 'lobby') { G.slots[slot] = null; SFX.leave(); }
      sendLobby(ph, true);
    } else if (msg.t === 's') {
      const b = msg.b | 0, j = !!(b & 4);
      if (j && !src.rj) src.tap = true;
      if (msg.st && msg.stId !== ph.stId) { src.stTap = true; ph.stId = msg.stId; }
      src.rl = !!(b & 1); src.rr = !!(b & 2); src.rj = j;
    }
  });
  conn.on('close', drop);
  conn.on('error', drop);
  ph.drop = drop;
}
function pickSlot(ph, slot, name) {
  const src = ph.src, si = ph.si;
  if (slot < 0 || slot > 3) return;
  if (name) src.name = name;
  const cur = ownSlot(si);
  if (cur === slot) { G.slots[slot].name = src.name; G.lobbyHop[slot] = 1; sendLobby(ph, true); return; }
  if (G.state !== 'lobby') return say(ph, 'A match is running. You can join when it returns to the lobby.');
  if (G.slots[slot]) return say(ph, `${displayName(slot)} already has that player.`);
  if (cur >= 0) G.slots[cur] = null;
  G.slots[slot] = { src: si, seq: G.joinSeq++, pid: src.pid, name: src.name };
  G.lobbyHop[slot] = 1; SFX.join(slot);
  sendLobby(ph, true);
}
function say(ph, text) { try { ph.conn.send({ t: 'msg', text }); } catch (e) {} }
function sendLobby(ph, force) {
  const my = ownSlot(ph.si);
  const obj = { t: 'l', g: G.state, my, slots: G.slots.map((x, i) => ({ t: !!x, n: displayName(i), me: i === my })) };
  const j = JSON.stringify(obj);
  if (!force && j === ph.sent) return;
  ph.sent = j;
  try { ph.conn.send(obj); } catch (e) {}
}
function netTick() {
  const now = performance.now();
  for (const ph of NET.phones.slice()) {
    if (ph.open && now - ph.last > 4000) { try { ph.conn.close(); } catch (e) {} ph.drop(); continue; }
    if (ph.open) sendLobby(ph, false);
  }
}

// ---------------------------------------------------------------------
//  Player names (no backend: stored in this browser / sent by each phone)
// ---------------------------------------------------------------------
function loadNames() { try { return JSON.parse(localStorage.getItem('cc-names') || '[]'); } catch (e) { return []; } }
function displayName(i) {
  const sl = G.slots[i];
  return (sl && sl.name) || (!(sl && SRC[sl.src] && SRC[sl.src].type === 'ph') && G.names[i]) || PCOL[i].name;
}
const nameBox = document.getElementById('nameBox'), nbIn = document.getElementById('nbIn');
let nameSlot = -1;
function openNameBox(i) {
  nameSlot = i;
  document.getElementById('nbP').textContent = `P${i + 1} ${PCOL[i].name}`;
  document.getElementById('nbP').style.color = PCOL[i].c;
  nbIn.value = G.names[i] || '';

class Builder {
  constructor() { this.cols = []; this.x = 0; this.g = 14; this.crushers = []; this.saws = []; this.movers = []; this.flagX = 0; }
  ensure(c) { while (this.cols.length <= c) this.cols.push(new Uint8Array(ROWS)); }
  set(c, r, t) { if (r < 0 || r >= ROWS || c < 0) return; this.ensure(c); this.cols[c][r] = t; }
  fill(x0, y0, x1, y1, t) { for (let c = x0; c < x1; c++) for (let r = y0; r < y1; r++) this.set(c, r, t); }
  ground(x0, x1, top) { this.fill(x0, top, x1, ROWS, T.GROUND); }
}
const SEG = {
  flat(b, n) { b.ground(b.x, b.x + n, b.g); b.x += n; },
  pit(b, n) { b.x += n; b.ensure(b.x); },
  up(b, n = 6, h = 2) { b.g -= h; SEG.flat(b, n); },
  down(b, n = 6, h = 2) { b.g += h; SEG.flat(b, n); },
  spikes(b, n) {
    SEG.flat(b, 2); b.ground(b.x, b.x + n, b.g); b.fill(b.x, b.g - 1, b.x + n, b.g, T.SPK); b.x += n; SEG.flat(b, 2);
  },
  crushers(b, k = 2, wait = 1, w = 2) {
    SEG.flat(b, 2);
    for (let i = 0; i < k; i++) {
      b.ground(b.x, b.x + w + 2, b.g);
      b.crushers.push({ tx: b.x, restRow: b.g - 5, w, wait, delay: 0.3 + i * 0.55 });
      b.x += w + 2;
    }
    SEG.flat(b, 1);
  },
  crusherPit(b, k = 3, wait = 1) {
    for (let i = 0; i < k; i++) {
      b.x += 2;
      b.fill(b.x, b.g, b.x + 3, b.g + 1, T.PLAT);
      b.crushers.push({ tx: b.x, restRow: b.g - 5, w: 3, wait, delay: 0.2 + i * 0.7 });
      b.x += 3;
    }
    b.x += 2;
  },
  sawBob(b, k = 2, period = 2) {
    SEG.flat(b, 3);
    for (let i = 0; i < k; i++) {
      b.ground(b.x, b.x + 5, b.g);
      b.saws.push({ kind: 'line', ax: b.x + 2.5, ay: b.g - 0.15, bx: b.x + 2.5, by: b.g - 4.2, period, phase: i * 2.2, rad: 30 });
      b.x += 5;
    }
    SEG.flat(b, 2);
  },
  sawRail(b, n = 10, period = 2.6) {
    b.ground(b.x, b.x + n, b.g);
    b.saws.push({ kind: 'line', ax: b.x + 2, ay: b.g + 0.15, bx: b.x + n - 2, by: b.g + 0.15, period, phase: 0, rad: 30, rail: true });
    b.x += n;
  },
  sawOrbit(b, k = 1, period = 2.8) {
    const x = b.x;
    SEG.flat(b, 12);
    b.fill(x + 5, b.g - 3, x + 7, b.g - 2, T.PLAT);
    for (let i = 0; i < k; i++)
      b.saws.push({ kind: 'circle', cx: x + 6, cy: b.g - 2.5, r: 2.7, period, phase: Math.PI * 0.5 + i * Math.PI, rad: 28 });
  },
  pitPlats(b) {
    const x = b.x, g = b.g;
    b.fill(x + 3, g - 1, x + 5, g, T.PLAT);
    b.fill(x + 8, g - 2, x + 10, g - 1, T.PLAT);
    b.fill(x + 13, g - 1, x + 15, g, T.PLAT);
    b.x += 18;
  },
  moverPit(b, n = 12, period = 4.4) {
    const x = b.x;

    b.x += n; b.ensure(b.x);

  crumbleBridge(b) {

      b.fill(c, g, c + 3, g + 1, T.CRUMBLE); c += 3;
    }
    b.fill(c, g, c + 1, ROWS, T.GROUND); c++;

  },
  springWall(b) {
    SEG.flat(b, 3);
    b.ground(b.x, b.x + 5, b.g); b.set(b.x + 2, b.g, T.SPRING); b.x += 5;
    b.ground(b.x, b.x + 4, b.g - 4); b.x += 4;
    SEG.flat(b, 3);
  },
  ceilRun(b, n = 14) {
    const x = b.x, g = b.g;
    b.ground(x, x + n, g);
    b.fill(x, 0, x + n, g - 4, T.CEIL);
    b.fill(x + 1, g - 4, x + n - 1, g - 3, T.SPKD);
    for (const o of [3, 6, 9, n - 3]) if (o < n - 1) b.set(x + o, g - 1, T.SPK);
    b.x += n;
  },
  pillars(b, hs = [0, -1, -2, -1, 0]) {

  springHop(b) {

    b.x += 4; b.ensure(b.x);

    b.g += 3; SEG.flat(b, 3);
  },
  climb(b) {

    b.fill(x + 2, g - 1, x + 14, g, T.SPK);
    b.fill(x + 2, g - 2, x + 4, g - 1, T.PLAT);
    b.fill(x + 6, g - 4, x + 8, g - 3, T.PLAT);
    b.fill(x + 10, g - 3, x + 12, g - 2, T.PLAT);
    b.x += 16;
  },
  finish(b) { SEG.flat(b, 4); b.flagX = (b.x + 2) * TS; SEG.flat(b, 16); },
};

function tileAt(c, r) {

const solidAt = (c, r) => SOLID[tileAt(c, r)] === 1;
const overlaps = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  const r0 = Math.floor((p.y + 1) / TS), r1 = Math.floor((p.y + p.h - 1) / TS);

function moveX(p, dx, depth = 0) {
  if (!dx) return;

  if (dx > 0) {
    const c = Math.floor((p.x + p.w) / TS);
    for (let r = r0; r <= r1; r++) if (solidAt(c, r)) { p.x = c * TS - p.w - 0.001; if (p.vx > 0) p.vx = 0; break; }
  } else {
    const c = Math.floor(p.x / TS);
    for (let r = r0; r <= r1; r++) if (solidAt(c, r)) { p.x = (c + 1) * TS + 0.001; if (p.vx < 0) p.vx = 0; break; }
  }
  for (const s of G.level.crushers) {
    if (!overlaps(p, s)) continue;
    if (p.y + p.h - s.y < 6) continue; // let vertical resolution handle edges
    if (dx > 0) { p.x = s.x - p.w - 0.001; if (p.vx > 0) p.vx = 0; } else { p.x = s.x + s.w + 0.001; if (p.vx < 0) p.vx = 0; }
  }
  if (depth < 3) for (const q of G.players) {
    if (q === p || !isActive(q) || !overlaps(p, q)) continue;
    if ((q.x - p.x) * dx <= 0) continue;  // only push players that are ahead of us
    const vo = Math.min(p.y + p.h, q.y + q.h) - Math.max(p.y, q.y);
    if (vo < 10) continue;
    const pen = dx > 0 ? p.x + p.w - q.x : q.x + q.w - p.x;
    if (pen <= 0) continue;
    moveX(q, Math.sign(dx) * pen * 0.5, depth + 1);
    if (dx > 0) p.x = Math.min(p.x, q.x - p.w - 0.001); else p.x = Math.max(p.x, q.x + q.w + 0.001);
    // shoulder-bump: a fast charge knocks the other player away
    if (depth === 0 && q.bumpCd <= 0 && Math.abs(p.vx) > 200 && (p.vx - q.vx) * Math.sign(dx) > 230) {
      q.vx = p.vx * 1.05; q.knock = 0.22; p.vx *= 0.3; q.bumpCd = 0.35; p.bumpCd = 0.2;
      q.qx = 0.75; q.qy = 1.2; G.shake = Math.max(G.shake, 3);
      SFX.bump();
      spawnBurst(q.x + (dx > 0 ? 0 : q.w), q.y + q.h * 0.5, 6, '#ffffff', 160, 0.25, 3);
    }
  }
  if (G.state !== 'lobby') {
    const right = G.cam.x + W - p.w;
    if (p.x > right) { p.x = right; if (p.vx > 0) p.vx = 0; }
  }
}

function land(p, obj) {
  if (p.vy > 380) {
    p.qx = 1.25; p.qy = 0.75;
    spawnDust(p.x + p.w / 2, p.y + p.h, 5);
    SFX.land();
  }
  p.vy = 0; p.onGround = true; p.ground = obj; p.jumping = false;
}

function moveY(p, dy) {
  p.onGround = false; p.ground = null;
  p.y += dy;
  const c0 = Math.floor(p.x / TS), c1 = Math.floor((p.x + p.w - 0.01) / TS);
  if (dy > 0) {
    const r = Math.floor((p.y + p.h) / TS);
    let hit = false, spring = -1;
    for (let c = c0; c <= c1; c++) if (solidAt(c, r)) { hit = true; if (tileAt(c, r) === T.SPRING) spring = c; }
    if (hit) {
      p.y = r * TS - p.h;
      if (spring >= 0) {
        p.vy = -PHYS.spring; p.jumping = false; p.qx = 0.7; p.qy = 1.35;
        G.level.springAnim.set(spring * ROWS + r, 0.35);
        SFX.spring(); spawnBurst(p.x + p.w / 2, p.y + p.h, 6, '#ffffff', 120, 0.3, 3);
      } else {
        land(p, 'tile');
        for (let c = c0; c <= c1; c++) if (tileAt(c, r) === T.CRUMBLE) triggerCrumble(c, r);
      }
    }
  } else if (dy < 0) {
    const r = Math.floor(p.y / TS);
    for (let c = c0; c <= c1; c++) if (solidAt(c, r)) { p.y = (r + 1) * TS; if (p.vy < 0) p.vy = 0; p.jumpCut = true; break; }
  }
  const L = G.level;
  for (const s of L.crushers) {
    if (!overlaps(p, s)) continue;
    if (p.y + p.h / 2 < s.y + s.h / 2) { p.y = s.y - p.h; if (p.vy >= 0) land(p, s); }
    else if (s.state !== 'slam') { p.y = s.y + s.h; if (p.vy < 0) p.vy = 0; }
  }
  if (p.vy >= 0) for (const m of L.movers) {
    if (p.x + p.w <= m.x + 2 || p.x >= m.x + m.w - 2) continue;
    const pb = p.y + p.h, prevB = pb - dy, prevTop = m.y - m.dy;
    if (prevB <= prevTop + 1.5 && pb >= m.y) { p.y = m.y - p.h; land(p, m); }
  }
  for (const q of G.players) {
    if (q === p || !isActive(q) || !overlaps(p, q)) continue;
    if (p.y + p.h / 2 < q.y + q.h / 2) {
      p.y = q.y - p.h;
      if (p.vy >= 0) land(p, q);
    } else if (p.vy < 0) {
      // jumping into someone above launches them upward
      p.y = q.y + q.h;
      if (q.vy > p.vy - 50) { q.vy = p.vy - 70; q.onGround = false; q.ground = null; q.jumping = false; q.qx = 0.8; q.qy = 1.2; }
      p.vy *= 0.85;
    } else {
      q.y = p.y - q.h;
      if (q.vy > 0) land(q, p);
    }
  }
}

// ---------------------------------------------------------------------
//  Hazards
// ---------------------------------------------------------------------
function updateHazards(L, dt, time) {
  for (const c of L.crushers) {
    const oy = c.y;
    c.shake = 0;
    switch (c.state) {
      case 'idle': c.t -= dt; if (c.t <= 0) { c.state = 'warn'; c.t = 0.45; } break;
      case 'warn': c.t -= dt; c.shake = 1; if (c.t <= 0) { c.state = 'slam'; c.vy = 250; } break;
      case 'slam':
        c.vy = Math.min(c.vy + 5200 * dt, 1800); c.y += c.vy * dt;
        if (c.y + c.h >= c.floorY) {
          c.y = c.floorY - c.h; c.state = 'hold'; c.t = 0.45;
          const onScreen = c.x + c.w > G.cam.x - 100 && c.x < G.cam.x + W + 100;
          if (onScreen && G.state !== 'lobby') {
            SFX.slam(0.6); G.shake = Math.max(G.shake, 6);
            for (let i = 0; i < 10; i++) G.particles.push({ x: c.x + Math.random() * c.w, y: c.floorY - 2, vx: rnd(-160, 160), vy: rnd(-200, -40), life: 0.5, max: 0.5, size: rnd(3, 6), color: 'rgba(230,230,230,0.85)', g: 600 });
          }
        }
        if (c.y > ROWS * TS + 100) { c.y = ROWS * TS + 100; c.state = 'hold'; c.t = 0.3; }
        break;
      case 'hold': c.t -= dt; if (c.t <= 0) c.state = 'rise'; break;
      case 'rise': c.y -= 170 * dt; if (c.y <= c.restY) { c.y = c.restY; c.state = 'idle'; c.t = c.wait; } break;
    }
    c.dx = 0; c.dy = c.y - oy;
  }
  for (const s of L.saws) {
    const a = TAU * time / s.period + s.phase;
    if (s.kind === 'line') { const k = (1 - Math.cos(a)) / 2; s.x = lerp(s.ax, s.bx, k); s.y = lerp(s.ay, s.by, k); }
    else { s.x = s.cx + Math.cos(a) * s.r; s.y = s.cy + Math.sin(a) * s.r; }
    s.rot += dt * 14;
  }
  for (const m of L.movers) {
    const k = (1 - Math.cos(TAU * time / m.period)) / 2;
    const nx = lerp(m.ax, m.bx, k), ny = lerp(m.ay, m.by, k);
    m.dx = nx - m.x; m.dy = ny - m.y; m.x = nx; m.y = ny;
  }
  // crumbling blocks
  for (const [key, cr] of L.crumbles) {
    cr.t -= dt;
    if (cr.state === 'shake' && cr.t <= 0) {
      const c = Math.floor(key / ROWS), r = key % ROWS;
      L.cols[c][r] = T.E; cr.state = 'gone'; cr.t = 4.5;
      if (G.state !== 'lobby') SFX.crumble();
      for (let i = 0; i < 6; i++) G.particles.push({ x: c * TS + rnd(4, 36), y: r * TS + rnd(4, 36), vx: rnd(-60, 60), vy: rnd(-80, 40), life: 1.2, max: 1.2, size: rnd(5, 10), color: '#a8784a', g: 1400, sq: true });
    } else if (cr.state === 'gone' && cr.t <= 0) {
      const c = Math.floor(key / ROWS), r = key % ROWS;
      const box = { x: c * TS, y: r * TS, w: TS, h: TS };
      if (G.players.some(p => p.alive && overlaps(p, box))) { cr.t = 0.3; continue; }
      L.cols[c][r] = T.CRUMBLE; L.crumbles.delete(key);
    }
  }
  for (const [k, v] of L.springAnim) { if (v - dt <= 0) L.springAnim.delete(k); else L.springAnim.set(k, v - dt); }
}
function triggerCrumble(c, r) {
  const key = c * ROWS + r, L = G.level;
  if (L.crumbles.has(key)) return;
  L.crumbles.set(key, { state: 'shake', t: 0.42 });
}

function circleRect(cx, cy, rad, x, y, w, h) {
  const nx = clamp(cx, x, x + w), ny = clamp(cy, y, y + h);
  const dx = cx - nx, dy = cy - ny;
  return dx * dx + dy * dy < rad * rad;
}
function checkHazards(p) {
  const L = G.level;
  const hx = p.x + 3, hy = p.y + 3, hw = p.w - 6, hh = p.h - 4;
  const c0 = Math.floor(hx / TS), c1 = Math.floor((hx + hw) / TS);
  const r0 = Math.floor(hy / TS), r1 = Math.floor((hy + hh) / TS);
  for (let c = c0; c <= c1; c++) for (let r = r0; r <= r1; r++) {
    const t = tileAt(c, r);
    if (t === T.SPK) { if (hx < c * TS + TS - 6 && hx + hw > c * TS + 6 && hy + hh > r * TS + TS * 0.45) return kill(p, 'IMPALED!'); }
    else if (t === T.SPKD) { if (hx < c * TS + TS - 6 && hx + hw > c * TS + 6 && hy < r * TS + TS * 0.55) return kill(p, 'IMPALED!'); }
  }
  for (const s of L.saws) if (circleRect(s.x, s.y, s.rad * 0.82, hx, hy, hw, hh)) return kill(p, 'SLICED!');
  for (const c of L.crushers) if (c.state === 'slam' && hx < c.x + c.w - 2 && hx + hw > c.x + 2 && hy < c.y + c.h && hy + hh > c.y + c.h - 30) return kill(p, 'CRUSHED!');
  if (p.y > ROWS * TS + 40) return kill(p, 'FELL!');
  if (p.x + p.w * 0.5 < G.cam.x) return kill(p, 'BLOCKED OUT!');
}

function kill(p, reason) {
  if (!p.alive) return;
  p.alive = false; p.deathReason = reason;
  const cx = clamp(p.x + p.w / 2, G.cam.x + 20, G.cam.x + W - 20);
  const cy = clamp(p.y + p.h / 2, 30, H - 30);
  spawnBurst(cx, cy, 26, p.color, 420, 0.9, 6);
  spawnBurst(cx, cy, 10, '#ffffff', 300, 0.5, 4);
  const px = reason === 'BLOCKED OUT!' ? G.cam.x + 150 : cx;
  G.popups.push({ text: reason, sub: displayName(p.id), x: px, y: cy - 30, color: p.color, life: 1.6, max: 1.6 });
  G.shake = Math.max(G.shake, 9);
  if (reason === 'BLOCKED OUT!') SFX.blocked(); else SFX.death();
}

// ---------------------------------------------------------------------
//  Particles
// ---------------------------------------------------------------------
function spawnBurst(x, y, n, color, speed, life, size) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * TAU, s = speed * (0.3 + Math.random() * 0.7);
    G.particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 100, life: life * rnd(0.6, 1), max: life, size: size * rnd(0.6, 1.2), color, g: 900, sq: Math.random() < 0.5 });
  }
}
function spawnDust(x, y, n) {
  for (let i = 0; i < n; i++) G.particles.push({ x: x + rnd(-10, 10), y: y - 2, vx: rnd(-90, 90), vy: rnd(-70, -10), life: 0.35, max: 0.35, size: rnd(3, 6), color: 'rgba(255,255,255,0.7)', g: 200 });
}
function updateParticles(dt) {
  for (let i = G.particles.length - 1; i >= 0; i--) {
    const q = G.particles[i];
    q.life -= dt; if (q.life <= 0) { G.particles.splice(i, 1); continue; }
    q.vy += (q.g || 0) * dt; q.x += q.vx * dt; q.y += q.vy * dt;
  }
  for (let i = G.popups.length - 1; i >= 0; i--) { const q = G.popups[i]; q.life -= dt; q.y -= 30 * dt; if (q.life <= 0) G.popups.splice(i, 1); }
  if (G.particles.length > 900) G.particles.splice(0, G.particles.length - 900);
}

// ---------------------------------------------------------------------
//  Player update
// ---------------------------------------------------------------------
function newPlayer(slot, order) {
  const P = PCOL[slot];
  return {
    id: slot, src: G.slots[slot].src, color: P.c, dark: P.d, light: P.l,
    x: 2 * TS + order * 50, y: 14 * TS - 34, w: 26, h: 34, vx: 0, vy: 0, px: 0, py: 0,
    onGround: true, ground: 'tile', coyote: 0, buffer: 0, jumping: false, jumpCut: true,
    alive: true, finished: false, face: 1, qx: 1, qy: 1, knock: 0, bumpCd: 0, anim: 0, dx: 0, blink: Math.random() * 4,
  };
}

function updatePlayer(p, dt) {
  const inp = SRC[p.src];
  const jp = inp.jp; inp.jp = false;
  p.qx += (1 - p.qx) * Math.min(1, dt * 14); p.qy += (1 - p.qy) * Math.min(1, dt * 14);
  p.blink -= dt; if (p.blink < -0.12) p.blink = 2 + Math.random() * 3;
  if (p.knock > 0) p.knock -= dt;
  if (p.bumpCd > 0) p.bumpCd -= dt;
  const sx = p.x;

  if (p.finished) {
    p.vx = approach(p.vx, 0, PHYS.decG * dt);
    if (p.onGround && Math.random() < dt * 2.5) { p.vy = -500; p.qx = 0.8; p.qy = 1.2; }
    p.vy = Math.min(p.vy + PHYS.grav * dt, PHYS.maxFall);
    const ov = G.players; G.players = [];   // finished players don't collide with others
    moveX(p, p.vx * dt); moveY(p, p.vy * dt);
    G.players = ov;
    p.dx = p.x - sx;
    return;
  }

  // ride whatever we're standing on
  const g = p.ground;
  if (g && g !== 'tile') {
    if (g.dx) moveX(p, g.dx, 1);
    if (g.dy) {
      p.y += g.dy;
      if (g.dy < 0 && overlapsSolid(p)) return kill(p, 'CRUSHED!');
    }
  }

  const playing = G.state === 'play' || G.state === 'roundEnd';
  const dir = playing ? (inp.r ? 1 : 0) - (inp.l ? 1 : 0) : 0;
  const target = dir * PHYS.maxRun;
  let a;
  if (p.onGround) a = dir === 0 ? PHYS.decG : (p.vx !== 0 && Math.sign(p.vx) !== dir ? PHYS.turnG : PHYS.accG);
  else a = dir === 0 ? PHYS.decA : (p.vx !== 0 && Math.sign(p.vx) !== dir ? PHYS.accA * 1.3 : PHYS.accA);
  if (p.knock > 0) a *= 0.15;
  p.vx = approach(p.vx, target, a * dt);
  if (dir) p.face = dir;

  // coyote time + jump buffer
  if (p.onGround) p.coyote = PHYS.coyote; else p.coyote -= dt;
  if (jp && playing) p.buffer = PHYS.buffer; else p.buffer -= dt;
  if (p.buffer > 0 && p.coyote > 0) {
    p.vy = -PHYS.jumpV; p.jumping = true; p.jumpCut = false;
    p.buffer = 0; p.coyote = 0;
    if (g && g !== 'tile' && g.id !== undefined) { g.vy = Math.max(g.vy, 120); g.qx = 1.25; g.qy = 0.75; } // jumping off a head squashes it
    if (g && g.dx) p.vx += g.dx / dt * 0.5;
    p.onGround = false; p.ground = null;
    p.qx = 0.7; p.qy = 1.3;
    spawnDust(p.x + p.w / 2, p.y + p.h, 4);
    SFX.jump();
  }
  // variable jump height
  if (p.jumping && !p.jumpCut && !inp.j && p.vy < 0) { p.vy *= PHYS.cut; p.jumpCut = true; }
  let grav = PHYS.grav;
  if (p.vy > 0) grav *= PHYS.fallMul;
  else if (p.jumping && !p.jumpCut && Math.abs(p.vy) < 140) grav *= PHYS.apexMul;
  p.vy = Math.min(p.vy + grav * dt, PHYS.maxFall);

  moveX(p, p.vx * dt);
  moveY(p, p.vy * dt);
  if (p.onGround && Math.abs(p.vx) > 20) p.anim += Math.abs(p.vx) * dt * 0.045;
  p.dx = p.x - sx;
}

// ---------------------------------------------------------------------
//  Match / round flow
// ---------------------------------------------------------------------
function joinedSlots() { return G.slots.map((s, i) => s ? i : -1).filter(i => i >= 0); }
function startMatch() {
  G.scores = [0, 0, 0, 0]; G.round = 0; G.lastLevel = -1; G.matchWinner = -1;
  nextRound();
}
function pickLevel() {
  const l = tourLevel(G.courseMode, G.round);
  if (l >= 0) return l;
  let r; do { r = Math.floor(Math.random() * LEVELS.length); } while (r === G.lastLevel);
  return r;
}
function nextRound() {
  G.round++;
  const li = pickLevel(); G.lastLevel = li;
  G.level = buildLevel(li);
  const slots = joinedSlots();
  G.players = slots.map((s, i) => newPlayer(s, i));
  for (const p of G.players) { p.px = p.x; p.py = p.y; }
  for (const s of SRC) s.jp = false;
  G.cam.x = 0; G.cam.px = 0; G.cam.speed = 0;
  G.time = 0; G.playT = 0; G.cd = 3.2; G.cdShown = 4;
  G.winner = -1; G.roundOver = false; G.reason = ''; G.timeScale = 1;
  G.particles = []; G.popups = []; G.shake = 0; G.paused = false;
  G.state = 'countdown';
}
function endRound(w, reason) {
  if (G.roundOver) return;
  G.roundOver = true; G.winner = w; G.reason = reason;
  if (w >= 0) { G.scores[w]++; SFX.win(); } else SFX.draw();
  if (w >= 0 && G.scores[w] >= WIN_SCORE) G.matchWinner = w;
  G.state = 'roundEnd'; G.endT = 0; G.timeScale = 0.35;
}
function checkRoundEnd() {
  if (G.roundOver) return;
  const alive = G.players.filter(isActive);
  if (G.players.length > 1) {
    if (alive.length === 1) endRound(alive[0].id, 'is the last one standing!');
    else if (alive.length === 0) endRound(-1, 'Everyone got blocked out!');
  } else if (alive.length === 0) endRound(-1, 'Practice run over — try again!');
}
function quitToLobby() {
  G.state = 'lobby'; G.paused = false; G.players = []; G.level = null; G.particles = []; G.popups = []; G.confetti = [];
  G.timeScale = 1;
}

// One fixed simulation step
function step(dt) {
  const L = G.level;
  G.stepCount++;
  if (G.state === 'play' || G.state === 'roundEnd') {
    G.time += dt;
    if (G.state === 'play') {
      G.playT += dt;
      G.cam.speed = G.playT < 1.2 ? 0 : Math.min(L.speedMax, L.speed0 + L.ramp * (G.playT - 1.2));
      let cx = G.cam.x + G.cam.speed * dt;
      let lead = -1e9;
      for (const p of G.players) if (isActive(p)) lead = Math.max(lead, p.x);
      if (lead > -1e9) cx = Math.max(cx, lead - W * 0.55);
      G.cam.x = Math.min(cx, L.w * TS - W);
    }
    updateHazards(L, dt, G.time);
    for (const p of G.players) if (isActive(p)) {
      for (const c of L.crushers) if (c.state === 'slam' && overlaps({ x: p.x + 3, y: p.y + 3, w: p.w - 6, h: p.h - 4 }, c)) kill(p, 'CRUSHED!');
    }
    const n = G.players.length;
    for (let k = 0; k < n; k++) {
      const p = G.players[(k + G.stepCount) % n];
      if (!p.alive) continue;
      updatePlayer(p, dt);
      if (isActive(p)) {
        checkHazards(p);
        if (p.alive && p.x + p.w / 2 >= L.flagX) {
          p.finished = true;
          spawnBurst(p.x + p.w / 2, p.y, 30, p.color, 400, 1, 5);
          if (!G.roundOver) endRound(p.id, 'reached the flag first!');
        }
      }
    }
    checkRoundEnd();
  } else if (G.state === 'countdown') {
    updateHazards(L, 0, 0);
    for (const p of G.players) updatePlayer(p, dt);
  }
  updateParticles(dt);
  G.shake = Math.max(0, G.shake - dt * 30);
}

// Per-frame (real time) logic: menus, timers
function frameLogic(rdt) {
  G.realT += rdt;
  if (G.toast) { G.toast.t -= rdt; if (G.toast.t <= 0) G.toast = null; }
  if (menuPress.has('KeyF')) toggleFullscreen();
  if (menuPress.has('KeyM')) {
    AU.mode = (AU.mode + 1) % 3; applyAudioMode();
    G.toast = { text: ['Sound: ON', 'Music: OFF', 'Sound: MUTED'][AU.mode], t: 1.5 };
  }
  const anyJoinedEdge = (field) => joinedSlots().some(s => SRC[G.slots[s].src][field]);

  switch (G.state) {
    case 'lobby': {
      // remove disconnected pads
      for (let i = 0; i < 4; i++) { const s = G.slots[i]; if (s && SRC[s.src].type !== 'kb' && !SRC[s.src].connected) { G.slots[i] = null; } }
      for (let si = 0; si < SRC.length; si++) {
        const s = SRC[si];
        if (s.ej && s.type !== 'ph') {
          const slot = G.slots.findIndex(x => x && x.src === si);
          if (slot >= 0) G.lobbyHop[slot] = 1;
          else {
            let target = si < 4 && !G.slots[si] ? si : G.slots.findIndex(x => !x);
            if (target >= 0) { G.slots[target] = { src: si, seq: G.joinSeq++ }; G.lobbyHop[target] = 1; SFX.join(target); }
          }
        }
        if (s.type === 'gp' && s.ebk) {
          const slot = G.slots.findIndex(x => x && x.src === si);
          if (slot >= 0) { G.slots[slot] = null; SFX.leave(); }
        }
        if (s.type !== 'kb' && s.est) tryStart();
        if (s.esel) cycleCourse(1);
      }
      if (menuPress.has('Enter') || menuPress.has('Space') || menuPress.has('NumpadEnter')) tryStart();
      if (menuPress.has('Backspace') || menuPress.has('Delete')) {

        ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.fillRect(x + 6, top + 1, TS - 12, 2);

}

    ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by); ctx.stroke();

  ctx.closePath();
  ctx.fillStyle = '#d9dfe5'; ctx.fill(); ctx.strokeStyle = '#59626d'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#a3adb8'; ctx.beginPath(); ctx.arc(0, 0, R * 0.55, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#7a848f'; ctx.lineWidth = 3;

function render(alpha) {
  ctx.setTransform(viewScale, 0, 0, viewScale, 0, 0);
  if (G.state === 'lobby') { renderLobby(); return; }
  const L = G.level;
  let camX = lerp(G.cam.px, G.cam.x, alpha);
  const shX = G.shake > 0 ? rnd(-G.shake, G.shake) : 0, shY = G.shake > 0 ? rnd(-G.shake, G.shake) : 0;
  camX = Math.round(camX * viewScale) / viewScale;
  drawBackground(camX, L.th, G.realT);
  ctx.save();
  ctx.translate(-camX + shX, shY);
  for (const m of L.movers) drawMover(m, L.th);
  drawTiles(L, camX);
  for (const s of L.saws) if (s.x > camX - 200 && s.x < camX + W + 200) drawSaw(s);
  for (const c of L.crushers) if (c.x > camX - 200 && c.x < camX + W + 200) drawCrusher(c);
  if (L.flagX > camX - 200 && L.flagX < camX + W + 200) drawFlag(L);
  for (const p of G.players) if (p.alive) drawPlayerWorld(p, alpha);
  for (const q of G.particles) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.color;
    if (q.sq) ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
    else { ctx.beginPath(); ctx.arc(q.x, q.y, q.size / 2, 0, TAU); ctx.fill(); }
  }
  ctx.globalAlpha = 1;
  for (const q of G.popups) {
    const a = clamp(q.life / q.max * 2, 0, 1), sc = 1 + Math.max(0, (q.life - q.max + 0.15)) * 3;
    ctx.globalAlpha = a;
    txt(q.text, q.x, q.y, 30 * sc, q.color);
    txt(q.sub, q.x, q.y + 26, 15, '#fff');
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  // left-edge danger glow
  let minD = 1e9;
  for (const p of G.players) if (isActive(p)) minD = Math.min(minD, p.x - G.cam.x);
  if (G.state === 'play' && minD < 260) {
    const a = (1 - minD / 260) * (0.45 + 0.2 * Math.sin(G.realT * 14));
    const g = ctx.createLinearGradient(0, 0, 140, 0);
    g.addColorStop(0, `rgba(255,30,30,${a})`); g.addColorStop(1, 'rgba(255,30,30,0)');

  }
  // off-screen-above markers

    const sx = clamp(p.x + p.w / 2 - camX, 12, W - 12);

    if (n >= 1 && n <= 3) txt(String(n), W / 2, H / 2 - 40, 120 + f * 40, '#fff');
    txt(L.name.toUpperCase(), W / 2, H / 2 + 60, 34, '#ffe36b');
    txt('Round ' + G.round + '  ·  Run right! Don\'t fall behind the left edge.', W / 2, H / 2 + 100, 18, '#fff');
  } else if (G.goT > 0) {
    ctx.globalAlpha = clamp(G.goT / 0.4, 0, 1);
    txt('GO!', W / 2, H / 2 - 40, 140 + (0.8 - G.goT) * 80, '#7dff6b');
    ctx.globalAlpha = 1;
  }
  if (G.state === 'roundEnd') drawRoundBanner();
  if (G.state === 'score') drawScoreboard();
  if (G.state === 'matchEnd') drawMatchEnd();
  if (G.paused) drawPause();

}

    if (s) { ctx.shadowColor = P.c; ctx.shadowBlur = 24; }
    ctx.fillStyle = s ? 'rgba(20,24,44,0.88)' : 'rgba(12,14,26,0.7)';
    rrect(x, y0, cw, ch, 18); ctx.fill();
    ctx.restore();
    ctx.strokeStyle = s ? P.c : 'rgba(255,255,255,0.18)'; ctx.lineWidth = s ? 4 : 2;
    rrect(x, y0, cw, ch, 18); ctx.stroke();
    if (s) { ctx.fillStyle = P.c; rrect(x, y0, cw, 46, { upperLeft: 18, upperRight: 18, lowerLeft: 0, lowerRight: 0 }); ctx.fill(); }
    txtFit(`P${i + 1}  ${displayName(i)}`, x + cw / 2, y0 + 24, 24, s ? '#fff' : P.c, cw - 24, 'center', s ? P.d : 'rgba(0,0,0,0.8)');
    if (!(s && SRC[s.src].type === 'ph')) txt('✎ click card to set name', x + cw / 2, y0 + 291, 10, 'rgba(255,255,255,0.45)', 'center', null, 'Verdana, sans-serif');
    const hop = Math.sin(G.lobbyHop[i] * Math.PI) * 40;
    ctx.globalAlpha = s ? 1 : 0.28;
    drawChar(x + cw / 2, y0 + 175 - hop, 2.6, P, Math.sin(t + i) > 0 ? 1 : -1, 1, 1 + (s ? Math.sin(t * 6 + i) * 0.03 : 0), 0, s ? 'happy' : null, !s);
    ctx.globalAlpha = 1;
    if (s) {
      const lab = srcLabel(s.src);
      txt('READY!', x + cw / 2, y0 + 210, 24, '#7dff6b');
      txt(lab.a, x + cw / 2, y0 + 245, 17, '#fff', 'center', null, 'Verdana, sans-serif');
      txt(lab.b, x + cw / 2, y0 + 270, 15, 'rgba(255,255,255,0.7)', 'center', null, 'Verdana, sans-serif');
    } else {
      ctx.globalAlpha = 0.65 + 0.35 * Math.sin(t * 4 + i);
      txt(`Press ${KB[i].joinKey} to join`, x + cw / 2, y0 + 222, 19, '#fff');
      ctx.globalAlpha = 1;
      txt(`${KB[i].label}: ${KB[i].keys}`, x + cw / 2, y0 + 252, 13, 'rgba(255,255,255,0.65)', 'center', null, 'Verdana, sans-serif');
      txt('or a gamepad · phones: scan the QR', x + cw / 2, y0 + 274, 13, 'rgba(255,255,255,0.65)', 'center', null, 'Verdana, sans-serif');
    }
  }
  // course selection + start
  const n = joinedSlots().length;
  ctx.fillStyle = 'rgba(0,0,0,0.5)'; rrect(W / 2 - 300, 532, 600, 44, 12); ctx.fill();
  txt('◀', W / 2 - 280, 554, 18, '#ffe36b');
  txt('▶', W / 2 + 280, 554, 18, '#ffe36b');
  txt(COURSE_MODES[G.courseMode], W / 2, 554, 20, '#fff');
  txt('C / Tab / [ ]  or  LB / RB / Select  to change course', W / 2, 590, 12, 'rgba(255,255,255,0.75)', 'center', null, 'Verdana, sans-serif');
  if (n >= 2) {
    ctx.globalAlpha = 0.7 + 0.3 * Math.sin(t * 6);
    txt(`Press ENTER or START to race!  (${n} players)`, W / 2, 628, 28, '#7dff6b');
    ctx.globalAlpha = 1;
  } else if (n === 1) {
    txt('Need 2–4 players for a match  ·  ENTER = solo practice', W / 2, 628, 22, '#ffd27d');
  } else {
    txt('Each player: press your JUMP key / A button to join', W / 2, 628, 22, '#fff');
  }
  txt(`First to ${WIN_SCORE} round wins  ·  Win a round by reaching the flag first or being the last one alive`, W / 2, 668, 14, 'rgba(255,255,255,0.85)', 'center', null, 'Verdana, sans-serif');
  txt('Backspace / B = leave   ·   M = sound   ·   F = fullscreen   ·   Esc = pause', W / 2, 694, 12, 'rgba(255,255,255,0.6)', 'center', null, 'Verdana, sans-serif');
  // gamepad status
  const pads = SRC.slice(4, 8).filter(s => s.connected).length;
  txt(pads ? `🎮 ${pads} gamepad${pads > 1 ? 's' : ''} connected` : 'No gamepads detected (press a button to wake one)', W - 64, 20, 12, 'rgba(255,255,255,0.7)', 'right', null, 'Verdana, sans-serif');
  drawPhonePanel();
  drawToast();
}

// ---------------------------------------------------------------------
//  Main loop (fixed timestep, interpolated render)
// ---------------------------------------------------------------------
let last = performance.now(), acc = 0;
function savePrev() {
  G.cam.px = G.cam.x;
  for (const p of G.players) { p.px = p.x; p.py = p.y; }
}
function frame(now) {
  let rdt = (now - last) / 1000; last = now;
  if (rdt > 0.1) rdt = 0.1;
  pollInput();
  frameLogic(rdt);
  if (G.state !== 'lobby' && G.state !== 'score' && G.state !== 'matchEnd' && !G.paused) {
    acc += rdt * G.timeScale;
    let n = 0;
    while (acc >= STEP && n < 20) { savePrev(); step(STEP); acc -= STEP; n++; }
    if (n >= 20) acc = 0;
  } else if (G.state === 'matchEnd' || G.state === 'score') {
    updateParticles(rdt);
  }
  try { render(clamp(acc / STEP, 0, 1)); } catch (e) { console.error(e); }
  musicTick();
  netTick();
  requestAnimationFrame(frame);
}
canvas.focus();
netInit();
requestAnimationFrame(frame);
</script>
