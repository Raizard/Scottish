<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0d1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Crush Course Controller</title>
<style>
  :root { --bg: #0b0d1a; --bar: #151a33; --c: #6b7290; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: #fff; overflow: hidden; overscroll-behavior: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: calc(46px + env(safe-area-inset-top)); padding: env(safe-area-inset-top) 8px 0;
    display: flex; align-items: center; gap: 6px; background: var(--bar); z-index: 5; font-size: 14px; border-bottom: 3px solid var(--c); }
  #status { display: flex; align-items: center; gap: 7px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 700; }
  #dot { width: 10px; height: 10px; border-radius: 50%; background: #f5a623; flex: none; }
  #dot.ok { background: #36d26a; } #dot.bad { background: #ff4d4d; }
  .tb { border: 0; border-radius: 8px; padding: 8px 11px; background: rgba(255,255,255,.12); color: #fff; font: 800 12px system-ui, sans-serif; }
  #start { background: #2fd06a; color: #04220f; }
  .screen { position: fixed; top: calc(46px + env(safe-area-inset-top)); left: 0; right: 0; bottom: 0; display: none; }

  /* ---- setup: name + player picker ---- */
  #setup { overflow-y: auto; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); touch-action: pan-y; }
  #setup h2 { margin: 4px 0 6px; font-size: 18px; }
  #name { width: 100%; font: 700 22px system-ui, sans-serif; padding: 10px 12px; border-radius: 12px; border: 2px solid #3a4170; background: #111428; color: #fff; outline: none; user-select: text; -webkit-user-select: text; }
  #name:focus { border-color: #ffd22e; }
  .hint { font-size: 12px; opacity: .65; margin: 6px 0 14px; }
  #picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  @media (orientation: landscape) { #picks { grid-template-columns: repeat(4, 1fr); } }
  .pick { border: 3px solid var(--pc); background: color-mix(in srgb, var(--pc) 18%, #111428); color: #fff; border-radius: 16px; padding: 14px 8px; text-align: center; font: inherit; }
  .pick .sw { width: 46px; height: 54px; margin: 0 auto 8px; border-radius: 12px; background: var(--pc); border: 3px solid rgba(0,0,0,.35); position: relative; }
  .pick .sw::before, .pick .sw::after { content: ''; position: absolute; top: 14px; width: 10px; height: 13px; border-radius: 50%; background: #fff; }
  .pick .sw::before { left: 10px; } .pick .sw::after { right: 10px; }
  .pick b { display: block; font-size: 17px; letter-spacing: .5px; }
  .pick span { display: block; font-size: 12px; opacity: .8; margin-top: 3px; min-height: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pick.taken { opacity: .38; }
  .pick.me { box-shadow: 0 0 0 3px #fff inset; }
  #joinBtn { width: 100%; margin: 2px 0 18px; padding: 16px; border: 0; border-radius: 14px; font: 900 22px system-ui, sans-serif;
    background: var(--jc, #ffd22e); color: #111; box-shadow: 0 4px 0 rgba(0,0,0,.35); }
  #joinBtn:disabled { background: #3a4170; color: #aab; box-shadow: none; }
  #msg { margin-top: 14px; min-height: 20px; font-size: 14px; color: #ffd27d; text-align: center; }
  #back { margin-top: 10px; width: 100%; padding: 12px; font-size: 16px; display: none; }

  /* ---- controller ---- */
  #ctl { display: none; grid-template-columns: 1fr 1fr 1.6fr; grid-template-areas: "l r j"; gap: 12px;
    padding: 12px 12px calc(12px + env(safe-area-inset-bottom)); touch-action: none; }
  @media (orientation: portrait) { #ctl { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1.2fr; grid-template-areas: "l r" "j j"; } }
  #ctl.show { display: grid; }
  .btn { display: flex; align-items: center; justify-content: center; border-radius: 20px; background: rgba(255,255,255,.09);
    border: 3px solid rgba(255,255,255,.16); font-weight: 900; font-size: clamp(30px, 11vmin, 80px); color: #fff; }
  .btn[data-b="1"] { grid-area: l; } .btn[data-b="2"] { grid-area: r; }
  .btn.j { grid-area: j; background: color-mix(in srgb, var(--c) 55%, transparent); border-color: var(--c); font-size: clamp(26px, 9vmin, 64px); }
  .btn.on { background: rgba(255,255,255,.6); color: #111; transform: scale(.97); }
  #join { position: fixed; inset: 0; background: var(--bg); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 14px; z-index: 10; padding: 20px; text-align: center; }
  #join input { font-size: 28px; width: 7em; text-align: center; text-transform: uppercase; letter-spacing: 4px; padding: 8px; border-radius: 10px; border: 2px solid #555; background: #111; color: #fff; user-select: text; }
  #join button { font-size: 20px; padding: 10px 26px; border-radius: 10px; border: 0; background: #ffd22e; font-weight: 900; }
</style>
</head>
<body>
<div id="bar">
  <div id="status"><span id="dot"></span><span id="stext">Starting…</span></div>
  <button class="tb" id="change">Change</button>
  <button class="tb" id="start">START</button>
  <button class="tb" id="fs" title="Fullscreen">⛶</button>
</div>

<div class="screen" id="setup">
  <h2>Your name</h2>
  <input id="name" maxlength="20" placeholder="Type your name" autocomplete="nickname" enterkeyhint="done">
  <div class="hint">Shown above your character in the game. Saved on this phone.</div>
  <button id="joinBtn" disabled>Connecting…</button>
  <h2>Or pick a colour</h2>
  <div id="picks"></div>
  <div id="msg"></div>
  <button class="tb" id="back">Back to controller</button>
</div>

<div class="screen" id="ctl">
  <div class="btn" data-b="1">◀</div>
  <div class="btn" data-b="2">▶</div>
  <div class="btn j" data-b="4">JUMP</div>
</div>

<div id="join">
  <h2 style="margin:0">Crush Course controller</h2>
  <div>Enter the room code shown under the QR code on the game screen:</div>
  <input id="code" maxlength="5" autocomplete="off" autocapitalize="characters">
  <button id="go">Connect</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
const COLORS = [
  { name: 'BLUE', c: '#3b8bff' }, { name: 'RED', c: '#ff4d4d' }, { name: 'GREEN', c: '#2fd06a' }, { name: 'YELLOW', c: '#ffd22e' },
];
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} },
};
let pid = store.get('cc-pid', '');
if (!pid) { pid = Math.random().toString(36).slice(2) + Date.now().toString(36); store.set('cc-pid', pid); }
$('name').value = store.get('cc-name', '');

// ---------- state from the game ----------
let pendingPick = -1, lastRx = 0;
let lobby = { g: '', my: -1, slots: [] }, gotLobby = false, wantCtl = false, autoPicked = false, screen = '';
let lastSlot = -1; try { lastSlot = +(sessionStorage.getItem('cc-slot') ?? -1); } catch (e) {}
let bits = 0, conn = null, peer = null, connected = false, stId = 0, startPending = false;
const q = new URLSearchParams(location.search);
let room = (location.hash.slice(1) || q.get('room') || '').toUpperCase().replace(/[^A-Z0-9]/g, '');

function setStatus(t, cls) { $('stext').textContent = t; $('dot').className = cls || ''; }
function show(which) {
  screen = which;
  $('setup').style.display = which === 'setup' ? 'block' : 'none';
  $('ctl').classList.toggle('show', which === 'ctl');
  bits = 0; fingers.clear(); paintButtons();
  render();
}
const pickBtns = COLORS.map((c, i) => {
  const b = document.createElement('button');
  b.type = 'button'; b.className = 'pick'; b.style.setProperty('--pc', c.c);
  const sw = document.createElement('div'); sw.className = 'sw';
  const t = document.createElement('b'); t.textContent = `P${i + 1} ${c.name}`;
  b.append(sw, t, document.createElement('span'));
  b.addEventListener('click', () => pick(i));
  $('picks').appendChild(b);
  return b;
});
function myName() { return (lobby.my >= 0 && lobby.slots[lobby.my] && lobby.slots[lobby.my].n) || ''; }
function render() {
  const my = lobby.my, inLobby = lobby.g === 'lobby';
  document.documentElement.style.setProperty('--c', my >= 0 ? COLORS[my].c : '#6b7290');
  if (connected) {
    if (screen === 'ctl' && my >= 0) setStatus(`P${my + 1} · ${myName()}`, 'ok');
    else setStatus(`Room ${room}`, 'ok');
  }
  $('change').style.display = screen === 'ctl' && inLobby ? '' : 'none';
  $('start').style.display = screen === 'ctl' && my >= 0 ? '' : 'none'; // START only once you have a player
  // big JOIN button: your last colour if it's free, otherwise the first free one
  const free = i => lobby.slots[i] && !lobby.slots[i].t;
  const jb = $('joinBtn');
  let target = lastSlot >= 0 && free(lastSlot) ? lastSlot : [0, 1, 2, 3].find(free);
  if (!connected || !gotLobby) { jb.disabled = true; jb.textContent = connected ? 'Loading…' : 'Connecting…'; jb.style.removeProperty('--jc'); }
  else if (my >= 0) { jb.disabled = false; jb.textContent = `▶ BACK TO CONTROLLER (${COLORS[my].name})`; jb.style.setProperty('--jc', COLORS[my].c); target = my; }
  else if (!inLobby && pendingPick >= 0) { jb.disabled = true; jb.textContent = `Joining as ${COLORS[pendingPick].name} after this match…`; jb.style.setProperty('--jc', COLORS[pendingPick].c); }
  else if (!inLobby && target !== undefined) { jb.disabled = false; jb.textContent = 'JOIN NEXT MATCH'; jb.style.setProperty('--jc', COLORS[target].c); }
  else if (!inLobby) { jb.disabled = true; jb.textContent = 'Match running — wait for the lobby'; jb.style.removeProperty('--jc'); }
  else if (target === undefined) { jb.disabled = true; jb.textContent = 'All 4 players taken'; jb.style.removeProperty('--jc'); }
  else { jb.disabled = false; jb.textContent = `JOIN AS ${COLORS[target].name}`; jb.style.setProperty('--jc', COLORS[target].c); }
  jb.dataset.slot = target === undefined ? '' : target;
  $('back').style.display = screen === 'setup' && my >= 0 ? 'block' : 'none';
  // player picker
  // colour tiles are updated in place (never rebuilt) so a tap can't land on a replaced button
  COLORS.forEach((c, i) => {
    const s = lobby.slots[i] || { t: false, n: c.name, me: false };
    const b = pickBtns[i];
    b.className = 'pick' + (s.me ? ' me' : s.t ? ' taken' : '');
    b.querySelector('span').textContent = s.me ? 'You ✓' : s.t ? `Taken by ${s.n}` : pendingPick === i ? 'Joining after this match' : (inLobby || !gotLobby) ? 'Free · tap to play' : 'Free · next match';
    b.disabled = !!(s.t && !s.me);
  });

}
$('joinBtn').addEventListener('click', () => {
  const v = $('joinBtn').dataset.slot;
  if (v === '') return;
  if (lobby.g !== 'lobby' && lobby.my < 0) { pick(+v); return; }
  if (lobby.my >= 0 && +v === lobby.my) { saveName(); show('ctl'); return; }
  pick(+v);
});
function cleanName(v) { return [...String(v || '').replace(/[\u0000-\u001f\u007f]/g, '').replace(/\s+/g, ' ').trim()].slice(0, 12).join('').trim(); }
function saveName() { const n = cleanName($('name').value); $('name').value = n; store.set('cc-name', n); return n; }
function pick(i) {
  if (lobby.my === i) { const n = saveName(); sendMsg({ t: 'pick', slot: i, name: n }); show('ctl'); return; }
  const name = saveName();
  $('name').blur();
  if (!connected) { $('msg').textContent = 'Not connected yet…'; return; }
  // 9: tapped during a match -> join automatically when the lobby comes back
  if (gotLobby && lobby.g !== 'lobby') { pendingPick = i; $('msg').textContent = `You'll join as ${COLORS[i].name} when this match ends.`; render(); return; }
  $('msg').textContent = '';
  wantCtl = true;
  try { sessionStorage.setItem('cc-slot', i); } catch (e) {}
  lastSlot = i;
  sendMsg({ t: 'pick', slot: i, name });
}
$('name').addEventListener('keydown', e => { if (e.key === 'Enter') $('name').blur(); });
$('name').addEventListener('change', () => {
  const name = saveName();
  if (lobby.my >= 0) sendMsg({ t: 'pick', slot: lobby.my, name }); // rename while keeping the player
});
$('change').onclick = () => show('setup');
$('back').onclick = () => show('ctl');

// ---------- touch controls (multi-touch, fingers can slide between buttons) ----------
const ctlEl = $('ctl'), btns = [...ctlEl.querySelectorAll('.btn')];
const fingers = new Map();
function btnAt(x, y) { const el = document.elementFromPoint(x, y); return el && el.closest ? el.closest('#ctl .btn') : null; }
function paintButtons() { btns.forEach(b => b.classList.toggle('on', !!(bits & +b.dataset.b))); }
function recompute() {
  let next = 0;
  for (const el of fingers.values()) if (el) next |= +el.dataset.b;
  if (next === bits) return;
  if ((next & 4) && !(bits & 4) && navigator.vibrate) navigator.vibrate(12);
  bits = next; paintButtons(); send();
}
ctlEl.addEventListener('pointerdown', e => {
  e.preventDefault();
  if (e.target.hasPointerCapture && e.target.hasPointerCapture(e.pointerId)) e.target.releasePointerCapture(e.pointerId);
  fingers.set(e.pointerId, btnAt(e.clientX, e.clientY)); recompute(); keepAwake();
});
window.addEventListener('pointermove', e => { if (fingers.has(e.pointerId)) { fingers.set(e.pointerId, btnAt(e.clientX, e.clientY)); recompute(); } });
for (const ev of ['pointerup', 'pointercancel']) window.addEventListener(ev, e => { if (fingers.delete(e.pointerId)) recompute(); });
ctlEl.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
document.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => { fingers.clear(); recompute(); });
function releaseAll() { fingers.clear(); bits = 0; paintButtons(); sendMsg({ t: 's', b: 0 }); }
document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });
window.addEventListener('pagehide', () => { releaseAll(); try { conn && conn.close(); } catch (e) {} });

$('start').onclick = () => { stId++; startPending = true; send(); if (navigator.vibrate) navigator.vibrate(20); };
$('fs').onclick = () => {
  const d = document.documentElement;
  if (!document.fullscreenElement) (d.requestFullscreen || d.webkitRequestFullscreen || (() => {})).call(d);
  else document.exitFullscreen && document.exitFullscreen();
};
if (!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen)) $('fs').style.display = 'none';
let wake = null;
async function keepAwake() { try { if (!wake && navigator.wakeLock) { wake = await navigator.wakeLock.request('screen'); wake.addEventListener('release', () => wake = null); } } catch (e) {} }

// ---------- networking (PeerJS / WebRTC straight to the game) ----------
function sendMsg(m) { if (conn && connected) try { conn.send(m); } catch (e) {} }
function send() {
  const m = { t: 's', b: screen === 'ctl' ? bits : 0 };
  if (startPending) { m.st = 1; m.stId = stId; startPending = false; }
  sendMsg(m);
}
setInterval(send, 250); // heartbeat so the game knows we're still here
setInterval(() => { // the game pings every second; 4s of silence means it was closed or reloaded
  if (connected && performance.now() - lastRx > 4000) {
    connected = false; gotLobby = false; render();
    setStatus('Lost the game — reconnecting… (rescan the QR if this keeps up)', 'bad');
    try { conn && conn.close(); } catch (e) {}
    retry(500);
  }
}, 1000);

function onLobby(m) {
  if (m.g === 'lobby' && lobby.g && lobby.g !== 'lobby') $('msg').textContent = ''; // back in the lobby: clear old notices
  lobby = m;
  const firstLobby = !gotLobby; gotLobby = true;
  if (m.my >= 0 && (wantCtl || firstLobby || screen !== 'setup')) { wantCtl = false; if (screen !== 'ctl') show('ctl'); }
  else if (m.my < 0 && screen === 'ctl') show('setup');
  if (m.my >= 0 && m.g !== 'lobby' && screen === 'setup') show('ctl');
  if (m.g === 'lobby' && pendingPick >= 0 && m.my < 0) {
    const want = m.slots[pendingPick] && !m.slots[pendingPick].t ? pendingPick : [0, 1, 2, 3].find(i => m.slots[i] && !m.slots[i].t);
    pendingPick = -1;
    if (want !== undefined) { lobby = m; pick(want); }
  }
  // after a reload/reconnect in the lobby, grab the same player again if it's still free
  if (!autoPicked && m.my < 0 && m.g === 'lobby' && lastSlot >= 0 && m.slots[lastSlot] && !m.slots[lastSlot].t) { autoPicked = true; pick(lastSlot); }
  autoPicked = true;
  render();
}
function peerOptions() {
  const o = { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }] } };
  if (q.get('peerhost')) { o.host = q.get('peerhost'); o.port = +q.get('peerport') || 9000; o.path = q.get('peerpath') || '/'; o.secure = q.get('peersecure') === '1'; }
  return o;
}
let retryTimer = null, notFound = 0;
function retry(ms) { clearTimeout(retryTimer); retryTimer = setTimeout(connect, ms); }
function connect() {
  if (!peer || peer.destroyed) return startPeer();
  if (peer.disconnected) { peer.reconnect(); return retry(2500); }
  setStatus(`Connecting to room ${room}…`);
  if (conn) { try { conn.close(); } catch (e) {} }
  const c = peer.connect('crushcourse-' + room.toLowerCase(), { reliable: true, serialization: 'json' });
  conn = c;
  const t = setTimeout(() => { if (conn === c && !connected) { setStatus('Still connecting… same Wi-Fi as the game?', 'bad'); retry(500); } }, 12000);
  c.on('open', () => {
    clearTimeout(t); connected = true; autoPicked = false; gotLobby = false; lastRx = performance.now(); notFound = 0;
    sendMsg({ t: 'hello', pid, name: $('name').value.trim().slice(0, 12) });
    render();
  });
  c.on('data', m => {
    if (!m || typeof m !== 'object') return;
    lastRx = performance.now();
    if (m.t === 'l') onLobby(m);
    else if (m.t === 'msg') { $('msg').textContent = String(m.text || ''); if (screen !== 'setup') show('setup'); }
  });
  c.on('close', () => {
    if (conn !== c) return;
    connected = false; setStatus('Disconnected — reconnecting…', 'bad'); retry(2000);
  });
  c.on('error', () => {});
}
function startPeer() {
  if (!window.Peer) { setStatus('Could not load (check internet)', 'bad'); return; }
  setStatus('Starting…');
  peer = new Peer(peerOptions());
  peer.on('open', connect);
  peer.on('error', err => {
    if (err.type === 'peer-unavailable') {
      connected = false; notFound++;
      setStatus(`Game ${room} not found — is the game open?`, 'bad');
      if (notFound >= 3) { clearTimeout(retryTimer); notFound = 0; askCode(`Room ${room} wasn't found. Check the code on the game screen:`); }
      else retry(3000);
    }
    else if (['network', 'server-error', 'socket-error', 'socket-closed', 'disconnected'].includes(err.type)) { setStatus('Network problem — retrying…', 'bad'); retry(3000); }
    else setStatus('Error: ' + err.type, 'bad');
  });
  peer.on('disconnected', () => { if (!peer.destroyed) setTimeout(() => peer.disconnected && peer.reconnect(), 1500); });
}

// ---------- boot ----------
show('setup');
if (room.length === 5) startPeer();
else askCode();
function askCode(text) {
  const j = $('join'); j.style.display = 'flex';
  if (text) j.querySelector('div').textContent = text;
  $('code').value = room; $('code').focus();
}
function submitCode() {
  const v = $('code').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
  if (v.length !== 5) return;
  room = v; location.hash = v; $('join').style.display = 'none';
  if (peer && !peer.destroyed && !peer.disconnected) connect(); else startPeer();
}
$('go').onclick = submitCode;
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') submitCode(); });
</script>
</body>
</html>
